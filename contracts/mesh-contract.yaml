# FinTechBankX mesh contract (Proposed).
#
# Single source of truth for the mesh policies in deploy/kustomize/base.
# scripts/generate/render-mesh-policies.mjs renders the base manifests from
# this file and tests/ fail when the committed manifests drift from it.
#
# Aligned to the platform contract (platform pillar, 2026-10-08): one namespace
# per bounded context, SA = Helm chart name, http 8080 / management 8081,
# SPIFFE principal cluster.local/ns/<ns>/sa/<sa>, Keycloak realm fintechbankx.
#
# Call edges were read from the service repos (branch
# claude/project-thread-ty79y4) - application.yml, Helm values and HTTP
# adapters - not from target-state diagrams. Edges whose callee does not exist
# yet are listed under `gaps` and are NOT allowed by any policy.

istio:
  version: 1.24.3
  trustDomain: cluster.local

ports:
  http: 8080
  management: 8081

identity:
  realm: fintechbankx
  # Each workload's RequestAuthentication requires aud to contain its own
  # service id (platform contract addendum); the gateway checks issuer only.
  # Per-environment identity host comes from the overlay params (IDENTITY_HOST).
  issuer: https://IDENTITY_HOST/realms/fintechbankx
  jwksUri: https://IDENTITY_HOST/realms/fintechbankx/protocol/openid-connect/certs

gateway:
  namespace: istio-ingress
  serviceAccount: istio-ingressgateway
  selector:
    istio: ingressgateway
  # Container ports of the gateway Deployment (Helm chart istio/gateway 1.24.3).
  containerPorts: [80, 443]
  # Edge rate limit for the anonymous open-data APIs (platform review
  # 2026-10-08). Envoy local rate limit per gateway pod, keyed on nothing
  # (one bucket per route per pod, shared by every client), 429 when empty.
  # Proposed values: tune from traffic; total = per-pod rate x gateway
  # replicas (gatewayReplicas mirrors deploy/istio/helm autoscaling; tests
  # fail when they drift).
  # Not per client yet: Istio 1.24.3 ships Envoy 1.32, whose local rate limit
  # has no dynamic descriptors (max_dynamic_descriptors, Envoy 1.34 / Istio
  # 1.26), and the NLB does not pass the client address to the gateway
  # (preserve_client_ip off, no proxy protocol). Per-client limits need the
  # Istio upgrade plus proxy protocol (or a global rate limit service).
  anonymousRateLimit:
    routes: [svc-of-open-products-catalog, svc-of-atm-directory, svc-of-banking-metadata]
    maxTokens: 100
    tokensPerFill: 50
    fillInterval: 1s
    gatewayReplicas:
      dev: [2, 4]
      staging: [3, 6]
      prod: [3, 12]

  # Token locations the gateway RequestAuthentication validates. Istio's
  # defaults (Authorization "Bearer ", query access_token) plus
  # Authorization "DPoP ": TPP tokens are DPoP-bound (RFC 9449) and the
  # rtp-cutover cohort rule (R3) routes on the validated token's azp, which
  # the gateway only sees for tokens it validated. The gateway still checks
  # the issuer only; the DPoP proof is checked by the service.
  tokenLocations:
    fromHeaders:
      - {name: Authorization, prefix: "Bearer "}
      - {name: Authorization, prefix: "DPoP "}
    fromParams: [access_token]
  # Backends outside this mesh that the gateway still routes to during a
  # strangler cut-over. One explicit host each (placeholder replaced per
  # overlay from mesh-params), HTTPS originated by the gateway with the host
  # name verified; ServiceEntry and DestinationRule are visible to the
  # gateway namespace only. Egress uses the gateway's existing VPC 443 rule.
  legacyBackends:
    legacy-open-finance:
      host: LEGACY_OPEN_FINANCE_HOST
      evidence: enterprise-loan-management-system open-finance-context (requesttopay package); its deployment target is not in any platform repo yet
  # Strangler cut-overs at the gateway. Rules render as VirtualService routes
  # in this order, ahead of every other API route; regexes are RE2 full
  # matches on the path without query string (Envoy safe_regex), anchored,
  # never prefixes. A rule with `cohort: true` matches only tokens whose
  # cohort claim (validated by the gateway) is one of cohort.clients, one
  # exact value per entry; with an empty cohort the rule is not rendered at
  # all (an Istio route without match entries matches everything).
  cutovers:
    - name: rtp-cutover
      evidence: >-
        RUNBOOK-EXTRACT-pay-request-to-pay section 3 (request-to-pay PR #14
        d6049d7): R1 CONS-RTP2- follow-ups always to this service, R2 other
        ids to the monolith, R3 creates from the cohort, R4 other creates.
      target: payments/payment-request-to-pay-service
      legacy: legacy-open-finance
      cohort:
        name: rtp-cutover-cohort
        claim: azp
        # Runbook step 2: empty (no TPP moves). Step 3 adds pilot TPP client
        # ids here, one literal id per entry; step 4 = every TPP.
        clients: []
      rules:
        - id: R1
          to: target
          match:
            - {method: GET, regex: "^/open-finance/v1/payment-consents/CONS-RTP2-[0-9a-f-]{36}$"}
            - {method: POST, regex: "^/open-finance/v1/payment-consents/CONS-RTP2-[0-9a-f-]{36}/(accept|reject)$"}
        - id: R2
          to: legacy
          match:
            - {method: GET, regex: "^/open-finance/v1/payment-consents/[^/]+$"}
            - {method: POST, regex: "^/open-finance/v1/payment-consents/[^/]+/(accept|reject)$"}
        - id: R3
          to: target
          cohort: true
          match:
            - {method: POST, regex: "^/open-finance/v1/par$"}
        - id: R4
          to: legacy
          match:
            - {method: POST, regex: "^/open-finance/v1/par$"}

# kind: service   -> bounded-context namespace with application workloads
# kind: platform  -> platform namespace managed by a platform repo
namespaces:
  - name: lending
    context: lending
    kind: service
    workloads:
      - serviceAccount: loan-lifecycle-service
        serviceId: svc-ln-loan-lifecycle
        sourceRepo: fintechbankx-lendingpayments-loan-lifecycle-core
        apiPrefix: /api/v1/loans
        datastores: [aurora-postgresql, msk]
  - name: payments
    context: payments
    kind: service
    workloads:
      - serviceAccount: payment-initiation-settlement-service
        serviceId: svc-pay-initiation-settlement
        sourceRepo: fintechbankx-lendingpayments-payment-orchestration-initiation-settlement
        apiPrefix: /api/v1/payments
        datastores: [aurora-postgresql, msk]
      # Request-to-pay, recurring mandates and bulk orchestration: each has its
      # own Aurora PostgreSQL database and publishes through an outbox relay to
      # MSK (evt.pay.rtp / evt.pay.mandate / evt.pay.bulk); review of RtP #14
      # found the pods had no datastore egress (2026-10-08).
      - serviceAccount: payment-request-to-pay-service
        serviceId: svc-pay-request-to-pay
        sourceRepo: fintechbankx-lendingpayments-payment-orchestration-request-to-pay
        # TPP-facing, DPoP. No prefix route: the gateway routes its four exact
        # operations through gateway.cutovers rtp-cutover (R1 to R4).
        datastores: [aurora-postgresql, msk]
      - serviceAccount: payment-recurring-mandates-service
        serviceId: svc-pay-recurring-mandates
        sourceRepo: fintechbankx-lendingpayments-payment-orchestration-recurring-mandates
        apiPrefix: /open-finance/v1/vrp   # TPP-facing, DPoP enforced by the service (contract DPoP section)
        datastores: [aurora-postgresql, msk]
      - serviceAccount: payment-bulk-orchestration-service
        serviceId: svc-pay-bulk-orchestration
        sourceRepo: fintechbankx-lendingpayments-payment-orchestration-bulk-orchestration
        apiPrefix: /open-finance/v1/file-payments   # TPP-facing, DPoP enforced by the service (contract DPoP section)
        datastores: [aurora-postgresql, msk]
  - name: customer
    context: customer
    kind: service
    workloads:
      - serviceAccount: customer-profile-kyc-service
        serviceId: svc-cus-profile-kyc
        sourceRepo: fintechbankx-customer-profile-kyc-core
        apiPrefix: /api/v1/customers
        datastores: [aurora-postgresql, msk]
  - name: risk
    context: risk
    kind: service
    workloads:
      - serviceAccount: risk-decisioning-service
        serviceId: svc-rsk-decisioning
        sourceRepo: fintechbankx-riskcompliance-risk-decisioning-core
        apiPrefix: /api/v1/risk
        datastores: [aurora-postgresql, msk]
  - name: compliance
    context: compliance
    kind: service
    workloads:
      - serviceAccount: compliance-evidence-service
        serviceId: svc-cmp-evidence
        sourceRepo: fintechbankx-riskcompliance-compliance-evidence-core
        apiPrefix: /api/v1/compliance
        datastores: [aurora-postgresql, msk]
  - name: open-finance
    context: open-finance
    kind: service
    # Service accounts and datastores confirmed by the open-finance service
    # threads (2026-10-08). API prefixes from the controllers on branch
    # claude/project-thread-nfwa8t. Tokens are validated by the services
    # themselves (DPoP/FAPI), see exceptions.requestAuthentication.
    workloads:
      - serviceAccount: consent-authorization-service
        serviceId: svc-of-consent-authorization
        sourceRepo: fintechbankx-openfinance-consent-auth-service
        # TPP consents, the PSU authorization flow (/oauth2) and the
        # first-party consent actions (/api/v1/consents/{id}/authorize|revoke);
        # GET /api/v1/consents/{id} is the in-cluster service view (no gateway
        # ALLOW) and /internal/v1 is never routed. Consent PR #13 a81579a.
        apiPrefix: [/open-finance/v1/consents, /oauth2, /api/v1/consents]
        datastores: [aurora-postgresql, msk]
      - serviceAccount: payee-verification-service
        serviceId: svc-of-payee-verification
        sourceRepo: fintechbankx-openfinance-payee-metadata-payee-verification
        apiPrefix: /open-finance/v1/confirmation-of-payee
        datastores: [aurora-postgresql, msk]
      - serviceAccount: personal-financial-data-service
        serviceId: svc-of-personal-financial-data
        sourceRepo: fintechbankx-openfinance-retail-data-personal-financial
        apiPrefix: /open-finance/v1/accounts
        datastores: [documentdb, elasticache-redis, msk]
      - serviceAccount: business-financial-data-service
        serviceId: svc-of-business-financial-data
        sourceRepo: fintechbankx-openfinance-corporate-data-business-financial
        apiPrefix: /open-finance/v1/corporate
        datastores: [documentdb, elasticache-redis, msk]
      - serviceAccount: banking-metadata-service
        serviceId: svc-of-banking-metadata
        sourceRepo: fintechbankx-openfinance-payee-metadata-banking-metadata
        apiPrefix: /open-finance/v1/metadata
        datastores: [documentdb, elasticache-redis, msk]
      - serviceAccount: atm-directory-service
        serviceId: svc-of-atm-directory
        sourceRepo: fintechbankx-openfinance-open-data-atm-directory
        apiPrefix: /open-finance/v1/atms
        datastores: [aurora-postgresql]
      - serviceAccount: open-products-catalog-service
        serviceId: svc-of-open-products-catalog
        sourceRepo: fintechbankx-openfinance-open-data-products-catalog
        apiPrefix: /open-finance/v1/products
        datastores: [aurora-postgresql]
  - name: identity
    context: identity
    kind: platform
    # From fintechbankx-platform-identity-iam-keycloak-ldap deploy/kustomize
    # (Keycloak Operator CR, OpenLDAP component for dev/staging, realm import Job).
    workloads:
      - serviceAccount: keycloak
        serviceId: svc-idn-keycloak-ldap
        sourceRepo: fintechbankx-platform-identity-iam-keycloak-ldap
        datastores: [aurora-postgresql]
      - serviceAccount: openldap
        serviceId: platform-identity-openldap
        sourceRepo: fintechbankx-platform-identity-iam-keycloak-ldap
        destinationRule: false
      # keycloak-config-cli Job; native sidecar (sidecar.istio.io/nativeSidecar)
      # so the Job completes inside the mesh.
      - serviceAccount: keycloak-realm-import
        serviceId: platform-identity-realm-import
        sourceRepo: fintechbankx-platform-identity-iam-keycloak-ldap
        service: null
  - name: observability
    context: observability
    kind: platform
    # From fintechbankx-platform-observability-sre-operations deploy/values
    # (helm template of the pinned charts). Selectors are the chart pod labels;
    # several Tempo and Loki components share one service account, so their
    # principal is the same and only the pod selector differs.
    # Observability backends keep Istio defaults (destinationRule: false):
    # outlier ejection on stateful ingesters and the Prometheus HA pair would
    # do more harm than good.
    workloads:
      - serviceAccount: otel-collector
        serviceId: platform-observability-otel-collector
        sourceRepo: fintechbankx-platform-observability-sre-operations
        selector: {app.kubernetes.io/name: opentelemetry-collector, app.kubernetes.io/instance: otel-collector}
        destinationRule: false
      - serviceAccount: otel-gateway
        serviceId: platform-observability-otel-gateway
        sourceRepo: fintechbankx-platform-observability-sre-operations
        selector: {app.kubernetes.io/name: opentelemetry-collector, app.kubernetes.io/instance: otel-gateway}
        destinationRule: false
      - serviceAccount: prometheus
        serviceId: platform-observability-prometheus
        sourceRepo: fintechbankx-platform-observability-sre-operations
        # Bypasses its sidecar outbound (includeOutboundIPRanges "") and
        # scrapes with the Istio workload certificate (OUTPUT_CERTS).
        destinationRule: false
      - serviceAccount: kube-prometheus-stack-alertmanager
        name: alertmanager
        serviceId: platform-observability-alertmanager
        sourceRepo: fintechbankx-platform-observability-sre-operations
        selector: {app.kubernetes.io/name: alertmanager}
        destinationRule: false
        datastores: [alert-receivers]
      - serviceAccount: grafana
        serviceId: platform-observability-grafana
        sourceRepo: fintechbankx-platform-observability-sre-operations
        destinationRule: false
        datastores: [aurora-postgresql]
      - serviceAccount: tempo
        serviceId: platform-observability-tempo
        sourceRepo: fintechbankx-platform-observability-sre-operations
        destinationRule: false
        datastores: [aws-s3]
      - serviceAccount: tempo
        name: tempo-distributor
        serviceId: platform-observability-tempo
        sourceRepo: fintechbankx-platform-observability-sre-operations
        selector: {app.kubernetes.io/name: tempo, app.kubernetes.io/component: distributor}
        destinationRule: false
      - serviceAccount: tempo
        name: tempo-query-frontend
        serviceId: platform-observability-tempo
        sourceRepo: fintechbankx-platform-observability-sre-operations
        selector: {app.kubernetes.io/name: tempo, app.kubernetes.io/component: query-frontend}
        destinationRule: false
      - serviceAccount: tempo
        name: tempo-metrics-generator
        serviceId: platform-observability-tempo
        sourceRepo: fintechbankx-platform-observability-sre-operations
        selector: {app.kubernetes.io/name: tempo, app.kubernetes.io/component: metrics-generator}
        destinationRule: false
      - serviceAccount: loki
        serviceId: platform-observability-loki
        sourceRepo: fintechbankx-platform-observability-sre-operations
        destinationRule: false
        datastores: [aws-s3]
      - serviceAccount: loki
        name: loki-gateway
        serviceId: platform-observability-loki
        sourceRepo: fintechbankx-platform-observability-sre-operations
        selector: {app.kubernetes.io/name: loki, app.kubernetes.io/component: gateway}
        destinationRule: false
      - serviceAccount: yace
        serviceId: platform-observability-yace
        sourceRepo: fintechbankx-platform-observability-sre-operations
        destinationRule: false
      # No sidecar (documented exception below): NetworkPolicy only, never a
      # principal in an AuthorizationPolicy.
      - serviceAccount: kube-prometheus-stack-kube-state-metrics
        name: kube-state-metrics
        serviceId: platform-observability-kube-state-metrics
        sourceRepo: fintechbankx-platform-observability-sre-operations
        selector: {app.kubernetes.io/name: kube-state-metrics}
        sidecar: false
      - serviceAccount: kube-prometheus-stack-operator
        name: prometheus-operator
        serviceId: platform-observability-prometheus-operator
        sourceRepo: fintechbankx-platform-observability-sre-operations
        selector: {app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator}
        sidecar: false
  - name: istio-ingress
    context: platform
    kind: platform
    # Gateway pods use the istio/gateway chart's `gateway` injection template;
    # the addendum's injected list names only workload namespaces, and does
    # not list istio-ingress as non-injected.
    workloads:
      - serviceAccount: istio-ingressgateway
        serviceId: platform-mesh-ingress-gateway
        sourceRepo: fintechbankx-platform-mesh-security-service-mesh
  - name: istio-system
    context: platform
    kind: platform
    injection: none
    workloads: []
  - name: external-secrets
    context: platform
    kind: platform
    injection: disabled
    workloads: []
  # cert-manager and trust-manager (k8s/platform/cert-manager): cluster
  # resource and trust namespace for the internal CA key pair and bundle sources.
  - name: cert-manager
    context: platform
    kind: platform
    injection: disabled
    workloads: []

# Secret delivery (External Secrets Operator -> AWS Secrets Manager), security
# review 2026-10-08. Two ClusterSecretStores, each with its own ESO service
# account and IRSA role (k8s/platform/external-secrets):
#  - serviceStore: service namespaces (label fintechbankx.io/namespace-kind=
#    service) plus sharedStoreNamespaces; its role must not read platform keys.
#  - platformStore: only platformStoreNamespaces; holds the internal CA key,
#    ingress TLS and the Keycloak bootstrap/admin material.
# The generated ValidatingAdmissionPolicy (externalsecret-admission.yaml) makes
# every ExternalSecret in a governed namespace use serviceStore and read only
# keys <env>/<slug>/...: in a service namespace <slug> is the ExternalSecret's
# app.kubernetes.io/name label and must be one of that namespace's service
# accounts (payments holds four services); in a shared namespace <slug> is one
# of its listed slugs.
secrets:
  serviceStore: aws-secrets-manager
  serviceStoreServiceAccount: external-secrets
  platformStore: aws-secrets-manager-platform
  platformStoreServiceAccount: external-secrets-platform
  platformStoreNamespaces: [cert-manager, istio-ingress, identity]
  # Second path segment of keys that only the platform store may read.
  platformKeyPrefixes: [platform, identity-keycloak]
  # Platform namespaces that stay on the service store, with their key slugs
  # (observability repo deploy/kustomize/prereqs: <env>/observability/*,
  # <env>/observability-grafana/oidc-client).
  sharedStoreNamespaces:
    observability: [observability, observability-grafana]

# Documented exceptions. The validator fails on any weakening not listed here.
exceptions:
  injection:
    - namespace: istio-system
      reason: Istio control plane; never injected.
    - namespace: external-secrets
      reason: >-
        Not injected per platform contract addendum (2026-10-08). The ESO
        admission webhook is called by the kube-apiserver, which is not in the
        mesh; ESO only talks to the kube-apiserver and AWS Secrets Manager/STS.
    - namespace: cert-manager
      reason: >-
        cert-manager and trust-manager webhooks are called by the
        kube-apiserver (outside the mesh); they talk only to the kube-apiserver
        (CA issuer, no ACME). Holds the internal CA key pair.
  # Workloads in injected namespaces that run without a sidecar. They cannot
  # present a principal, so no AuthorizationPolicy names them.
  workloadInjection:
    - workload: observability/prometheus-operator
      reason: >-
        The kube-apiserver (outside the mesh) calls the operator's admission
        webhook on 10250; its admission Jobs would never finish with a sidecar.
    - workload: observability/kube-state-metrics
      reason: Only scraped by Prometheus (plain HTTP 8080, NetworkPolicy-scoped); talks only to the kube-apiserver.
    - workload: observability/node-exporter
      reason: hostNetwork DaemonSet; scraped on the node IP (9100).
  peerAuthentication: []          # no PERMISSIVE or DISABLE anywhere
  requestAuthentication:
    - namespace: open-finance
      reason: >-
        Open-finance services validate their own FAPI/DPoP tokens: the issuer
        is per-service configuration (OPENFINANCE_*_JWT_ISSUER, empty by
        default; consent-auth issues openfinance-internal-auth tokens), tokens
        arrive as "Authorization: DPoP" or "Bearer", and the open-data APIs
        (ATMs, products) are public. A Keycloak-issuer RequestAuthentication
        with aud = service id would reject valid TPP calls, so the namespace
        relies on default-deny plus per-principal ALLOW rules and the
        services' own token checks. Revisit once the issuer is fixed in the
        platform contract.
  networkPolicyDefaultDeny:
    - namespace: istio-system
      reason: istiod webhooks are called from EKS control-plane ENIs; not yet drilled.
    - namespace: external-secrets
      reason: ESO webhook is called from EKS control-plane ENIs; not yet drilled.
    - namespace: cert-manager
      reason: cert-manager / trust-manager webhooks are called from EKS control-plane ENIs; not yet drilled.

# Synchronous call edges (caller -> callee). Every edge renders an ALLOW
# AuthorizationPolicy on the callee and matching NetworkPolicies.
edges:
  # North-south: ingress gateway -> service APIs (JWT required, see requireJwt).
  - from: istio-ingress/istio-ingressgateway
    to: lending/loan-lifecycle-service
    port: 8080
    paths: [/api/v1/loans, /api/v1/loans/*]
    evidence: loan-infrastructure LoanController @RequestMapping("/api/v1/loans")
  - from: istio-ingress/istio-ingressgateway
    to: payments/payment-initiation-settlement-service
    port: 8080
    paths: [/api/v1/payments, /api/v1/payments/*]
    evidence: payment-infrastructure controller @RequestMapping("/api/v1/payments")
  # Gateway -> customer: first-party clients only (identity review
  # 2026-10-08): customers sign in through fintechbankx-web or
  # fintechbankx-mobile, staff through fintechbankx-staff-web. request.auth is
  # set by the customer workload's RequestAuthentication (aud
  # svc-cus-profile-kyc); the gateway forwards the token it validated.
  # Service-only credit operations stay off the public gateway (review
  # finding, customer thread 2026-10-08): only loan-lifecycle calls
  # POST credit/reserve|release. GET /credit and GET /kyc-status stay public
  # (CUSTOMER self-read, BANKER, ADMIN; customer thread 2026-10-08), so
  # /credit and everything below it is excluded here and GET /credit is
  # allowed by the next edge alone.
  - from: istio-ingress/istio-ingressgateway
    to: customer/customer-profile-kyc-service
    port: 8080
    paths: [/api/v1/customers, /api/v1/customers/*]
    notPaths: ["/api/v1/customers/{*}/credit"]
    when: &first-party-azp
      - key: request.auth.claims[azp]
        values: [fintechbankx-web, fintechbankx-mobile, fintechbankx-staff-web]
    evidence: customer-infrastructure CustomerController @RequestMapping("/api/v1/customers")
  - from: istio-ingress/istio-ingressgateway
    to: customer/customer-profile-kyc-service
    port: 8080
    methods: [GET]
    paths: ["/api/v1/customers/{*}/credit"]
    when: *first-party-azp
    evidence: customer thread 2026-10-08, GET /api/v1/customers/{id}/credit (CUSTOMER self-read, BANKER, ADMIN)
  - from: istio-ingress/istio-ingressgateway
    to: risk/risk-decisioning-service
    port: 8080
    paths: [/api/v1/risk, /api/v1/risk/*]
    notPaths: [/api/v1/risk/assess]   # called by payments only (service-only, review finding)
    evidence: risk controller @RequestMapping("/api/v1/risk")
  - from: istio-ingress/istio-ingressgateway
    to: compliance/compliance-evidence-service
    port: 8080
    paths: [/api/v1/compliance, /api/v1/compliance/*]
    notPaths: [/api/v1/compliance/screen]   # called by payments only (service-only, review finding)
    evidence: compliance controller @RequestMapping("/api/v1/compliance")
  - from: istio-ingress/istio-ingressgateway
    to: identity/keycloak
    port: 8080
    paths: [/realms/fintechbankx/*, /resources/*]
    evidence: platform contract (realm fintechbankx); admin console and master realm stay unreachable

  # East-west: loan -> customer credit (CustomerProfileHttpAdapter, caller JWT propagated).
  # Since a33b418 the loan service calls with its own client-credentials token
  # (client id svc-ln-loan-lifecycle); Keycloak must put svc-cus-profile-kyc in aud.
  - from: lending/loan-lifecycle-service
    to: customer/customer-profile-kyc-service
    port: 8080
    methods: [GET]
    paths: [/api/v1/customers/*]
    evidence: CUSTOMER_SERVICE_BASE_URL=http://customer-profile-kyc-service.customer.svc.cluster.local:8080; GET /api/v1/customers/{customerId}
  - from: lending/loan-lifecycle-service
    to: customer/customer-profile-kyc-service
    port: 8080
    methods: [POST]
    paths: ["/api/v1/customers/{*}/credit/reserve", "/api/v1/customers/{*}/credit/release"]
    evidence: CustomerProfileHttpAdapter POST /api/v1/customers/{customerId}/credit/{reserve|release}

