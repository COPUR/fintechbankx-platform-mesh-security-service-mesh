# FinTechBankX mesh contract (Proposed).
#
# Single source of truth for the mesh policies in deploy/kustomize/base.
# scripts/generate/render-mesh-policies.mjs renders the base manifests from
# this file and tests/ fail when the committed manifests drift from it.
#
# Aligned to the platform contract (platform pillar, 2026-10-08): one namespace
# per bounded context, SA = Helm chart name, http 8080 / management 8081,
# SPIFFE principal cluster.local/ns/<ns>/sa/<sa>, Keycloak realm fintechbankx.
#
# Call edges were read from the service repos (branch
# claude/project-thread-ty79y4) - application.yml, Helm values and HTTP
# adapters - not from target-state diagrams. Edges whose callee does not exist
# yet are listed under `gaps` and are NOT allowed by any policy.

istio:
  version: 1.24.3
  trustDomain: cluster.local

ports:
  http: 8080
  management: 8081

identity:
  realm: fintechbankx
  # Each workload's RequestAuthentication requires aud to contain its own
  # service id (platform contract addendum); the gateway checks issuer only.
  # Per-environment identity host comes from the overlay params (IDENTITY_HOST).
  issuer: https://IDENTITY_HOST/realms/fintechbankx
  jwksUri: https://IDENTITY_HOST/realms/fintechbankx/protocol/openid-connect/certs

gateway:
  namespace: istio-ingress
  serviceAccount: istio-ingressgateway
  selector:
    istio: ingressgateway
  # Container ports of the gateway Deployment (Helm chart istio/gateway 1.24.3).
  containerPorts: [80, 443]

# kind: service   -> bounded-context namespace with application workloads
# kind: platform  -> platform namespace managed by a platform repo
namespaces:
  - name: lending
    context: lending
    kind: service
    workloads:
      - serviceAccount: loan-lifecycle-service
        serviceId: svc-ln-loan-lifecycle
        sourceRepo: fintechbankx-lendingpayments-loan-lifecycle-core
        apiPrefix: /api/v1/loans
        datastores: [aurora-postgresql, msk]
  - name: payments
    context: payments
    kind: service
    workloads:
      - serviceAccount: payment-initiation-settlement-service
        serviceId: svc-pay-initiation-settlement
        sourceRepo: fintechbankx-lendingpayments-payment-orchestration-initiation-settlement
        apiPrefix: /api/v1/payments
        datastores: [aurora-postgresql, msk]
      # Service accounts confirmed by the payment service threads (2026-10-08).
      # No ingress route, datastore or call edge is confirmed yet, so they get
      # only the platform edges (identity, telemetry, scraping).
      - serviceAccount: payment-request-to-pay-service
        serviceId: svc-pay-request-to-pay
        sourceRepo: fintechbankx-lendingpayments-payment-orchestration-request-to-pay
      - serviceAccount: payment-recurring-mandates-service
        serviceId: svc-pay-recurring-mandates
        sourceRepo: fintechbankx-lendingpayments-payment-orchestration-recurring-mandates
      - serviceAccount: payment-bulk-orchestration-service
        serviceId: svc-pay-bulk-orchestration
        sourceRepo: fintechbankx-lendingpayments-payment-orchestration-bulk-orchestration
  - name: customer
    context: customer
    kind: service
    workloads:
      - serviceAccount: customer-profile-kyc-service
        serviceId: svc-cus-profile-kyc
        sourceRepo: fintechbankx-customer-profile-kyc-core
        apiPrefix: /api/v1/customers
        datastores: [aurora-postgresql, msk]
  - name: risk
    context: risk
    kind: service
    workloads:
      - serviceAccount: risk-decisioning-service
        serviceId: svc-rsk-decisioning
        sourceRepo: fintechbankx-riskcompliance-risk-decisioning-core
        apiPrefix: /api/v1/risk
        datastores: [aurora-postgresql]
  - name: compliance
    context: compliance
    kind: service
    workloads:
      - serviceAccount: compliance-evidence-service
        serviceId: svc-cmp-evidence
        sourceRepo: fintechbankx-riskcompliance-compliance-evidence-core
        apiPrefix: /api/v1/compliance
        datastores: [aurora-postgresql]
  - name: open-finance
    context: open-finance
    kind: service
    # Service accounts and datastores confirmed by the open-finance service
    # threads (2026-10-08). API prefixes from the controllers on branch
    # claude/project-thread-nfwa8t. Tokens are validated by the services
    # themselves (DPoP/FAPI), see exceptions.requestAuthentication.
    workloads:
      - serviceAccount: consent-authorization-service
        serviceId: svc-of-consent-authorization
        sourceRepo: fintechbankx-openfinance-consent-auth-service
        apiPrefix: /open-finance/v1/consents
        datastores: [aurora-postgresql, msk]
      - serviceAccount: payee-verification-service
        serviceId: svc-of-payee-verification
        sourceRepo: fintechbankx-openfinance-payee-metadata-payee-verification
        apiPrefix: /open-finance/v1/confirmation-of-payee
        datastores: [aurora-postgresql, msk]
      - serviceAccount: personal-financial-data-service
        serviceId: svc-of-personal-financial-data
        sourceRepo: fintechbankx-openfinance-retail-data-personal-financial
        apiPrefix: /open-finance/v1/accounts
        datastores: [documentdb, elasticache-redis, msk]
      - serviceAccount: business-financial-data-service
        serviceId: svc-of-business-financial-data
        sourceRepo: fintechbankx-openfinance-corporate-data-business-financial
        apiPrefix: /open-finance/v1/corporate
        datastores: [documentdb, elasticache-redis, msk]
      - serviceAccount: banking-metadata-service
        serviceId: svc-of-banking-metadata
        sourceRepo: fintechbankx-openfinance-payee-metadata-banking-metadata
        apiPrefix: /open-finance/v1/metadata
        datastores: [documentdb, elasticache-redis, msk]
      - serviceAccount: atm-directory-service
        serviceId: svc-of-atm-directory
        sourceRepo: fintechbankx-openfinance-open-data-atm-directory
        apiPrefix: /open-finance/v1/atms
        datastores: [aurora-postgresql]
      - serviceAccount: open-products-catalog-service
        serviceId: svc-of-open-products-catalog
        sourceRepo: fintechbankx-openfinance-open-data-products-catalog
        apiPrefix: /open-finance/v1/products
        datastores: [aurora-postgresql]
  - name: identity
    context: identity
    kind: platform
    workloads:
      - serviceAccount: keycloak
        serviceId: platform-identity-keycloak
        sourceRepo: fintechbankx-platform-identity-iam-keycloak-ldap
        datastores: [aurora-postgresql]
      - serviceAccount: openldap
        serviceId: platform-identity-openldap
        sourceRepo: fintechbankx-platform-identity-iam-keycloak-ldap
  - name: observability
    context: observability
    kind: platform
    workloads:
      - serviceAccount: otel-collector
        serviceId: platform-observability-otel-collector
        sourceRepo: fintechbankx-platform-observability-sre-operations
      - serviceAccount: prometheus
        serviceId: platform-observability-prometheus
        sourceRepo: fintechbankx-platform-observability-sre-operations
  - name: istio-ingress
    context: platform
    kind: platform
    # Gateway pods use the istio/gateway chart's `gateway` injection template;
    # the addendum's injected list names only workload namespaces, and does
    # not list istio-ingress as non-injected.
    workloads:
      - serviceAccount: istio-ingressgateway
        serviceId: platform-mesh-ingress-gateway
        sourceRepo: fintechbankx-platform-mesh-security-service-mesh
  - name: istio-system
    context: platform
    kind: platform
    injection: none
    workloads: []
  - name: external-secrets
    context: platform
    kind: platform
    injection: disabled
    workloads: []

# Documented exceptions. The validator fails on any weakening not listed here.
exceptions:
  injection:
    - namespace: istio-system
      reason: Istio control plane; never injected.
    - namespace: external-secrets
      reason: >-
        Not injected per platform contract addendum (2026-10-08). The ESO
        admission webhook is called by the kube-apiserver, which is not in the
        mesh; ESO only talks to the kube-apiserver and AWS Secrets Manager/STS.
  peerAuthentication: []          # no PERMISSIVE or DISABLE anywhere
  requestAuthentication:
    - namespace: open-finance
      reason: >-
        Open-finance services validate their own FAPI/DPoP tokens: the issuer
        is per-service configuration (OPENFINANCE_*_JWT_ISSUER, empty by
        default; consent-auth issues openfinance-internal-auth tokens), tokens
        arrive as "Authorization: DPoP" or "Bearer", and the open-data APIs
        (ATMs, products) are public. A Keycloak-issuer RequestAuthentication
        with aud = service id would reject valid TPP calls, so the namespace
        relies on default-deny plus per-principal ALLOW rules and the
        services' own token checks. Revisit once the issuer is fixed in the
        platform contract.
  networkPolicyDefaultDeny:
    - namespace: istio-system
      reason: istiod webhooks are called from EKS control-plane ENIs; not yet drilled.
    - namespace: external-secrets
      reason: ESO webhook is called from EKS control-plane ENIs; not yet drilled.

# Synchronous call edges (caller -> callee). Every edge renders an ALLOW
# AuthorizationPolicy on the callee and matching NetworkPolicies.
edges:
  # North-south: ingress gateway -> service APIs (JWT required, see requireJwt).
  - from: istio-ingress/istio-ingressgateway
    to: lending/loan-lifecycle-service
    port: 8080
    paths: [/api/v1/loans, /api/v1/loans/*]
    evidence: loan-infrastructure LoanController @RequestMapping("/api/v1/loans")
  - from: istio-ingress/istio-ingressgateway
    to: payments/payment-initiation-settlement-service
    port: 8080
    paths: [/api/v1/payments, /api/v1/payments/*]
    evidence: payment-infrastructure controller @RequestMapping("/api/v1/payments")
  - from: istio-ingress/istio-ingressgateway
    to: customer/customer-profile-kyc-service
    port: 8080
    paths: [/api/v1/customers, /api/v1/customers/*]
    evidence: customer-infrastructure CustomerController @RequestMapping("/api/v1/customers")
  - from: istio-ingress/istio-ingressgateway
    to: risk/risk-decisioning-service
    port: 8080
    paths: [/api/v1/risk, /api/v1/risk/*]
    evidence: risk controller @RequestMapping("/api/v1/risk")
  - from: istio-ingress/istio-ingressgateway
    to: compliance/compliance-evidence-service
    port: 8080
    paths: [/api/v1/compliance, /api/v1/compliance/*]
    evidence: compliance controller @RequestMapping("/api/v1/compliance")
  - from: istio-ingress/istio-ingressgateway
    to: identity/keycloak
    port: 8080
    paths: [/realms/fintechbankx/*, /resources/*]
    evidence: platform contract (realm fintechbankx); admin console and master realm stay unreachable

  # East-west: loan -> customer credit (CustomerProfileHttpAdapter, caller JWT propagated).
  # Since a33b418 the loan service calls with its own client-credentials token
  # (client id svc-ln-loan-lifecycle); Keycloak must put svc-cus-profile-kyc in aud.
  - from: lending/loan-lifecycle-service
    to: customer/customer-profile-kyc-service
    port: 8080
    methods: [GET]
    paths: [/api/v1/customers/*]
    evidence: CUSTOMER_SERVICE_BASE_URL=http://customer-profile-kyc-service.customer.svc.cluster.local:8080; GET /api/v1/customers/{customerId}
  - from: lending/loan-lifecycle-service
    to: customer/customer-profile-kyc-service
    port: 8080
    methods: [POST]
    paths: ["/api/v1/customers/{*}/credit/reserve", "/api/v1/customers/{*}/credit/release"]
    evidence: CustomerProfileHttpAdapter POST /api/v1/customers/{customerId}/credit/{reserve|release}

  # payments -> risk / compliance: confirmed by the service threads
  # (coordinator, 2026-10-08). No HTTP adapter exists on the payment branch yet,
  # so methods and paths are unknown and the rule is port-scoped only.
  - from: payments/payment-initiation-settlement-service
    to: risk/risk-decisioning-service
    port: 8080
    scope: port-only
    evidence: confirmed by service thread 2026-10-08; adapter not yet on claude/project-thread-ty79y4
  - from: payments/payment-initiation-settlement-service
    to: compliance/compliance-evidence-service
    port: 8080
    scope: port-only
    evidence: confirmed by service thread 2026-10-08; adapter not yet on claude/project-thread-ty79y4

  # North-south: ingress gateway -> open-finance APIs (service-side DPoP/FAPI).
  - from: istio-ingress/istio-ingressgateway
    to: open-finance/consent-authorization-service
    port: 8080
    paths: [/open-finance/v1/consents, /open-finance/v1/consents/*]
    evidence: confirmed by service thread 2026-10-08; ConsentController /open-finance/v1/consents
  - from: istio-ingress/istio-ingressgateway
    to: open-finance/payee-verification-service
    port: 8080
    paths: [/open-finance/v1/confirmation-of-payee, /open-finance/v1/confirmation-of-payee/*]
    evidence: confirmed by service thread 2026-10-08; @RequestMapping("/open-finance/v1/confirmation-of-payee")
  - from: istio-ingress/istio-ingressgateway
    to: open-finance/personal-financial-data-service
    port: 8080
    paths: [/open-finance/v1/accounts, /open-finance/v1/accounts/*]
    evidence: confirmed by service thread 2026-10-08; /open-finance/v1/accounts
  - from: istio-ingress/istio-ingressgateway
    to: open-finance/business-financial-data-service
    port: 8080
    paths: [/open-finance/v1/corporate/*]
    evidence: confirmed by service thread 2026-10-08; /open-finance/v1/corporate/{accounts,transactions}
  - from: istio-ingress/istio-ingressgateway
    to: open-finance/banking-metadata-service
    port: 8080
    paths: [/open-finance/v1/metadata/*]
    evidence: confirmed by service thread 2026-10-08; /open-finance/v1/metadata/...
  - from: istio-ingress/istio-ingressgateway
    to: open-finance/atm-directory-service
    port: 8080
    paths: [/open-finance/v1/atms, /open-finance/v1/atms/*]
    evidence: confirmed by service thread 2026-10-08; /open-finance/v1/atms
  - from: istio-ingress/istio-ingressgateway
    to: open-finance/open-products-catalog-service
    port: 8080
    paths: [/open-finance/v1/products, /open-finance/v1/products/*]
    evidence: confirmed by service thread 2026-10-08; /open-finance/v1/products

  # payments -> open finance consent and payee verification: confirmed by the
  # service threads (2026-10-08); no adapter on the payment branch yet.
  - from: payments/payment-initiation-settlement-service
    to: open-finance/consent-authorization-service
    port: 8080
    scope: port-only
    evidence: confirmed by service thread 2026-10-08; adapter not yet on claude/project-thread-ty79y4
  - from: payments/payment-initiation-settlement-service
    to: open-finance/payee-verification-service
    port: 8080
    scope: port-only
    evidence: confirmed by service thread 2026-10-08; adapter not yet on claude/project-thread-ty79y4

  # Every Spring resource server fetches the realm JWKS (OIDC_JWK_SET_URI);
  # client-credentials token exchange per platform contract.
  - from: "*/service-workloads"
    to: identity/keycloak
    port: 8080
    methods: [GET]
    paths: [/realms/fintechbankx/protocol/openid-connect/certs, /realms/fintechbankx/.well-known/openid-configuration]
    evidence: spring.security.oauth2.resourceserver.jwt.jwk-set-uri in every service application.yml
  - from: "*/service-workloads"
    to: identity/keycloak
    port: 8080
    methods: [POST]
    paths: [/realms/fintechbankx/protocol/openid-connect/token]
    evidence: platform contract - one confidential client per service, client-credentials

  # Telemetry: OTLP to the collector (platform contract).
  - from: "*/service-workloads"
    to: observability/otel-collector
    port: 4317
    evidence: platform contract OTLP gRPC otel-collector.observability.svc.cluster.local:4317
  - from: "*/service-workloads"
    to: observability/otel-collector
    port: 4318
    evidence: platform contract OTLP HTTP :4318

  # Scraping: Prometheus -> management port of every workload.
  - from: observability/prometheus
    to: "*/service-workloads"
    port: 8081
    methods: [GET]
    paths: [/actuator/prometheus, /actuator/health, /actuator/health/*]
    evidence: Helm pod annotations prometheus.io/port=8081, path /actuator/prometheus

  # Identity internals.
  - from: identity/keycloak
    to: identity/openldap
    port: 389
    evidence: platform contract - staff users federated from LDAP
  - from: identity/keycloak
    to: identity/keycloak
    port: 7800
    evidence: Keycloak (Infinispan/JGroups) cluster traffic between replicas

# External (MESH_EXTERNAL) dependencies reachable under REGISTRY_ONLY.
externalDependencies:
  aurora-postgresql:
    port: 5432
    protocol: TCP
    cidrParam: AURORA_CIDR
  documentdb:
    port: 27017
    protocol: TCP
    cidrParam: DOCDB_CIDR
  elasticache-redis:
    port: 6379
    protocol: TCP
    cidrParam: REDIS_CIDR
  msk:
    hosts: ["*.kafka.me-central-1.amazonaws.com"]
    ports: [9098, 9094]
    protocol: TLS
    cidrParam: MSK_CIDR
  aws-apis:
    hosts:
      - sts.me-central-1.amazonaws.com
      - secretsmanager.me-central-1.amazonaws.com
      - kms.me-central-1.amazonaws.com
    port: 443
    protocol: TLS
    cidrParam: VPC_CIDR
  identity-external:
    hosts: [IDENTITY_HOST]
    port: 443
    protocol: TLS

# Call edges found in service configuration whose callee does not exist yet.
gaps:
  - from: payments/payment-initiation-settlement-service
    to: core-banking accounts API
    evidence: >-
      payment-bootstrap application.yml payment.accounts.base-url
      ${ACCOUNTS_SERVICE_BASE_URL:http://core-banking-accounts:8080};
      CoreBankingAccountHttpAdapter GET /api/v1/accounts/{accountId}; Helm
      values ACCOUNTS_SERVICE_BASE_URL is empty. No core-banking repo,
      namespace or service account exists, so no policy allows it; with
      ACCOUNTS_ADAPTER=http the service fails closed.
  - from: payments/payment-initiation-settlement-service
    to: risk, compliance, open-finance consent and payee verification (paths)
    evidence: >-
      Edges confirmed by the service threads but no adapter exists yet; the
      ALLOW rules are port-only (8080) until methods and paths are known.
  - from: payments request-to-pay, recurring-mandates, bulk-orchestration
    to: ingress routes, datastores, call edges
    evidence: >-
      Only the service accounts are confirmed; they get identity, telemetry
      and scraping edges. Their controllers (main) expose /api/v1/pay-requests,
      /open-finance/v1/vrp, /open-finance/v1/file-payments and copies of
      /open-finance/v1/{accounts,consents,loans}, which overlap open-finance
      routes, so no gateway route is added until the owners confirm them.
  - from: risk/risk-decisioning-service, compliance/compliance-evidence-service
    to: Kafka
    evidence: >-
      Neither service configures Kafka (no spring.kafka, no @KafkaListener);
      they publish and consume no events yet, so they get no MSK egress.
