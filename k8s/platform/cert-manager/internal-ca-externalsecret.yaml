# Key pair of the FinTechBankX internal CA, synced from AWS Secrets Manager
# entry <env>/platform/internal-ca (properties: certificate = PEM CA
# certificate, private_key = PEM key). No key material lives in git.
# The Secret must be in cert-manager's cluster resource namespace for the
# ClusterIssuer and in trust-manager's trust namespace for the Bundle; both
# default to `cert-manager`. ENVIRONMENT is replaced per overlay.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fintechbankx-internal-ca-keypair
  namespace: cert-manager
  labels:
    fintechbankx.io/context: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: fintechbankx-internal-ca-keypair
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: ENVIRONMENT/platform/internal-ca
        property: certificate
    - secretKey: tls.key
      remoteRef:
        key: ENVIRONMENT/platform/internal-ca
        property: private_key
