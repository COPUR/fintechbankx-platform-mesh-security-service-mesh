# Token-only identity for ClusterSecretStore aws-secrets-manager-platform. ESO
# requests a projected token for it (serviceaccounts/token) and assumes the
# role in the annotation; no pod runs as this service account.
# PLATFORM_SECRETS_ROLE_ARN is replaced per overlay (terraform-modules output).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-platform
  namespace: external-secrets
  labels:
    fintechbankx.io/context: platform
  annotations:
    eks.amazonaws.com/role-arn: PLATFORM_SECRETS_ROLE_ARN
automountServiceAccountToken: false
