# The one ClusterSecretStore every FinTechBankX chart references (platform
# contract addendum 2026-10-08). Proposed until the platform squad merges it.
#
# Auth is IRSA: the External Secrets Operator runs as service account
# external-secrets in namespace external-secrets; its IAM role comes from
# terraform-modules stacks/platform (module external-secrets-irsa) and may read
# only arn:aws:secretsmanager:<region>:<account>:secret:<env>/* and decrypt
# with KMS keys tagged fintechbankx.io/secrets=true. The ServiceAccount and its
# eks.amazonaws.com/role-arn annotation are owned by the ESO Helm release.
#
# AWS_REGION is replaced per overlay by deploy/kustomize/components/mesh-params.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    fintechbankx.io/context: platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
