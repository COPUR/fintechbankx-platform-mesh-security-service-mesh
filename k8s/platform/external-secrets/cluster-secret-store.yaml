# ClusterSecretStore for service secrets (platform contract addendum
# 2026-10-08; scoped after the security review of 2026-10-08). Proposed until
# the platform squad merges it.
#
# Usable only from namespaces labelled fintechbankx.io/namespace-kind=service
# and from the shared platform namespace observability (contracts/
# mesh-contract.yaml `secrets`). Platform namespaces use
# aws-secrets-manager-platform instead (cluster-secret-store-platform.yaml).
# Inside the allowed namespaces the ValidatingAdmissionPolicy
# fintechbankx-externalsecret-scope (deploy/kustomize/base/generated/
# externalsecret-admission.yaml) limits each ExternalSecret to its own
# <env>/<service-slug>/ keys.
#
# Auth is IRSA: ESO service account external-secrets in namespace
# external-secrets (owned by the ESO Helm release). Its IAM role is
# module.role in terraform-modules modules/external-secrets-irsa (f7c8404),
# created by stacks/platform and exported as external_secrets_role_arn:
# ReadEnvironmentSecrets allows secretsmanager:GetSecretValue and
# DescribeSecret on arn:aws:secretsmanager:<region>:<account>:secret:<env>/*;
# DenyPlatformAndIdentitySecrets denies secretsmanager:* on <env>/platform/*,
# <env>/identity-keycloak/* and <env>/identity-openldap/* (these belong to
# aws-secrets-manager-platform); kms:Decrypt only via Secrets Manager with
# keys tagged fintechbankx.io/secrets=true. No write actions. The IAM policy
# is environment-wide; the per-service <env>/<slug>/ boundary inside it is
# the admission policy above, not IAM.
#
# AWS_REGION is replaced per overlay by deploy/kustomize/components/mesh-params.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    fintechbankx.io/context: platform
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          fintechbankx.io/namespace-kind: service
    - namespaces: [observability]
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
