# ClusterSecretStore for platform secrets (security review 2026-10-08):
# internal CA key pair (<env>/platform/internal-ca), ingress TLS, corporate
# directory CA and the Keycloak database / bootstrap-admin material
# (<env>/identity-keycloak/*). Proposed until the platform squad merges it.
#
# Usable only from cert-manager, istio-ingress and identity (explicit names,
# no label selector, so labelling a namespace cannot widen it).
#
# Auth is IRSA with its own ESO service account external-secrets-platform
# (serviceaccount-platform.yaml) and IAM role (terraform-modules, hand-off):
# read-only on <env>/platform/*, <env>/identity-keycloak/* and, for the
# realm import that sets every client secret, <env>/*/oidc-client.
#
# AWS_REGION is replaced per overlay by deploy/kustomize/components/mesh-params.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager-platform
  labels:
    fintechbankx.io/context: platform
spec:
  conditions:
    - namespaces: [cert-manager, istio-ingress, identity]
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-platform
            namespace: external-secrets
