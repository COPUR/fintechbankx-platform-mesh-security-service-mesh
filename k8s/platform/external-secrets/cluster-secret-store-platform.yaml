# ClusterSecretStore for platform secrets (security review 2026-10-08):
# internal CA key pair (<env>/platform/internal-ca), ingress TLS, corporate
# directory CA and the Keycloak database / bootstrap-admin material
# (<env>/identity-keycloak/*) and the OpenLDAP admin
# (<env>/identity-openldap/*). Proposed until the platform squad merges it.
#
# Usable only from cert-manager, istio-ingress and identity (explicit names,
# no label selector, so labelling a namespace cannot widen it).
#
# Auth is IRSA with its own ESO service account external-secrets-platform
# (serviceaccount-platform.yaml). Its IAM role is module.platform_role in
# terraform-modules modules/external-secrets-irsa (f7c8404), created by
# stacks/platform by default (create_platform_role = true) and exported as
# platform_secrets_role_arn (overlay parameter PLATFORM_SECRETS_ROLE_ARN).
# Statement ReadPlatformIdentityAndClientSecrets allows only
# secretsmanager:GetSecretValue and DescribeSecret on <env>/platform/*,
# <env>/identity-keycloak/*, <env>/identity-openldap/* and, for the realm
# import that sets every client secret, secrets named exactly
# <env>/<slug>/oidc-client (ARN <env>/*/oidc-client-??????); kms:Decrypt only
# via Secrets Manager with keys tagged fintechbankx.io/secrets=true. No write
# actions.
#
# AWS_REGION is replaced per overlay by deploy/kustomize/components/mesh-params.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager-platform
  labels:
    fintechbankx.io/context: platform
spec:
  conditions:
    - namespaces: [cert-manager, istio-ingress, identity]
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-platform
            namespace: external-secrets
