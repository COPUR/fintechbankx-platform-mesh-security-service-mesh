# dev: two gateway replicas; internal NLB (no public exposure of dev).
replicaCount: 2
autoscaling:
  minReplicas: 2
  maxReplicas: 4
podDisruptionBudget:
  minAvailable: 1
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi
service:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
