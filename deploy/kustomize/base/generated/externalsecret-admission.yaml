# Generated by scripts/generate/render-mesh-policies.mjs from contracts/mesh-contract.yaml.
# Do not edit by hand: change the contract and run `npm run generate`.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fintechbankx-externalsecret-scope
  annotations:
    fintechbankx.io/purpose: ExternalSecrets outside cert-manager, istio-ingress, identity must use ClusterSecretStore aws-secrets-manager and read only <env>/<slug>/ keys; in service namespaces <slug> is the app.kubernetes.io/name label and must be a service account of that namespace.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - external-secrets.io
        apiVersions:
          - "*"
        operations:
          - CREATE
          - UPDATE
        resources:
          - externalsecrets
    namespaceSelector:
      matchExpressions:
        - key: fintechbankx.io/namespace-kind
          operator: Exists
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - cert-manager
            - istio-ingress
            - identity
  variables:
    - name: env
      expression: "'ENVIRONMENT'"
    - name: scopes
      expression: "{'lending': ['loan-lifecycle-service'], 'payments': ['payment-bulk-orchestration-service', 'payment-initiation-settlement-service', 'payment-recurring-mandates-service', 'payment-request-to-pay-service'], 'customer': ['customer-profile-kyc-service'], 'risk': ['risk-decisioning-service'], 'compliance': ['compliance-evidence-service'], 'open-finance': ['atm-directory-service', 'banking-metadata-service', 'business-financial-data-service', 'consent-authorization-service', 'open-products-catalog-service', 'payee-verification-service', 'personal-financial-data-service'], 'observability': ['observability', 'observability-grafana']}"
    - name: allowed
      expression: "request.namespace in variables.scopes ? variables.scopes[request.namespace] : []"
    - name: serviceNamespace
      expression: has(namespaceObject.metadata.labels) && 'fintechbankx.io/namespace-kind' in namespaceObject.metadata.labels && namespaceObject.metadata.labels['fintechbankx.io/namespace-kind'] == 'service'
    - name: slug
      expression: "has(object.metadata.labels) && 'app.kubernetes.io/name' in object.metadata.labels ? object.metadata.labels['app.kubernetes.io/name'] : ''"
    - name: slugs
      expression: "variables.serviceNamespace ? variables.allowed.filter(s, s == variables.slug) : variables.allowed"
    - name: prefixes
      expression: variables.slugs.map(s, variables.env + '/' + s + '/')
    - name: keys
      expression: "(has(object.spec.data) ? object.spec.data.filter(d, has(d.remoteRef)).map(d, d.remoteRef.key) : []) + (has(object.spec.dataFrom) ? object.spec.dataFrom.filter(f, has(f.extract)).map(f, f.extract.key) : [])"
  validations:
    - expression: variables.slugs.size() > 0
      messageExpression: "variables.allowed.size() == 0 ? 'namespace ' + request.namespace + ' has no secret scope in the mesh contract' : 'ExternalSecret in service namespace ' + request.namespace + ' must carry label app.kubernetes.io/name set to one of its service accounts: ' + variables.allowed.join(', ')"
      reason: Forbidden
    - expression: has(object.spec.secretStoreRef) && object.spec.secretStoreRef.kind == 'ClusterSecretStore' && object.spec.secretStoreRef.name == 'aws-secrets-manager'
      message: secretStoreRef must be ClusterSecretStore aws-secrets-manager
      reason: Forbidden
    - expression: "!has(object.spec.data) || object.spec.data.all(d, !has(d.sourceRef) && has(d.remoteRef))"
      message: spec.data entries must use remoteRef and may not override the store (sourceRef)
      reason: Forbidden
    - expression: "!has(object.spec.dataFrom) || object.spec.dataFrom.all(f, !has(f.sourceRef) && !has(f.find) && has(f.extract))"
      message: spec.dataFrom entries must use extract with an explicit key (no find, no sourceRef)
      reason: Forbidden
    - expression: variables.slugs.size() == 0 || variables.keys.all(k, variables.prefixes.exists(p, k.startsWith(p)))
      messageExpression: "'every remote key must start with ' + variables.prefixes.join(' or ') + '; got ' + variables.keys.filter(k, !variables.prefixes.exists(p, k.startsWith(p))).join(', ')"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fintechbankx-externalsecret-scope
spec:
  policyName: fintechbankx-externalsecret-scope
  validationActions:
    - Deny
