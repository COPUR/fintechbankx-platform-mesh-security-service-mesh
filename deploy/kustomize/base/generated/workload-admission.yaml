apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fintechbankx-service-pod-security
  annotations:
    fintechbankx.io/purpose: "Pods and pod templates in service namespaces: no privileged container, host namespace, hostPath volume or hostPort, and no added capability except NET_ADMIN and NET_RAW on the istio-init init container."
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - "*"
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
      - apiGroups:
          - apps
        apiVersions:
          - "*"
        operations:
          - CREATE
          - UPDATE
        resources:
          - daemonsets
          - deployments
          - replicasets
          - statefulsets
      - apiGroups:
          - batch
        apiVersions:
          - "*"
        operations:
          - CREATE
          - UPDATE
        resources:
          - cronjobs
          - jobs
    namespaceSelector:
      matchLabels:
        fintechbankx.io/namespace-kind: service
  variables:
    - name: spec
      expression: "object.kind == 'Pod' ? object.spec : object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec"
    - name: init
      expression: "has(variables.spec.initContainers) ? variables.spec.initContainers : []"
    - name: main
      expression: "(has(variables.spec.containers) ? variables.spec.containers : []) + (has(variables.spec.ephemeralContainers) ? variables.spec.ephemeralContainers : [])"
    - name: all
      expression: variables.init + variables.main
  validations:
    - expression: "!variables.all.exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged)"
      messageExpression: "'privileged containers are not allowed in service namespaces: ' + variables.all.filter(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged).map(c, c.name).join(', ')"
      reason: Forbidden
    - expression: "!(has(variables.spec.hostNetwork) && variables.spec.hostNetwork) && !(has(variables.spec.hostPID) && variables.spec.hostPID) && !(has(variables.spec.hostIPC) && variables.spec.hostIPC)"
      message: hostNetwork, hostPID and hostIPC are not allowed in service namespaces
      reason: Forbidden
    - expression: "!has(variables.spec.volumes) || variables.spec.volumes.all(v, !has(v.hostPath))"
      messageExpression: "'hostPath volumes are not allowed in service namespaces: ' + variables.spec.volumes.filter(v, has(v.hostPath)).map(v, v.name).join(', ')"
      reason: Forbidden
    - expression: "!variables.all.exists(c, has(c.ports) && c.ports.exists(p, has(p.hostPort) && p.hostPort != 0))"
      messageExpression: "'hostPort is not allowed in service namespaces: ' + variables.all.filter(c, has(c.ports) && c.ports.exists(p, has(p.hostPort) && p.hostPort != 0)).map(c, c.name).join(', ')"
      reason: Forbidden
    - expression: "!variables.main.exists(c, has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add) && c.securityContext.capabilities.add.size() > 0)"
      messageExpression: "'containers may not add capabilities in service namespaces: ' + variables.main.filter(c, has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add) && c.securityContext.capabilities.add.size() > 0).map(c, c.name).join(', ')"
      reason: Forbidden
    - expression: variables.init.all(c, !(has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add) && c.securityContext.capabilities.add.size() > 0) || c.name == 'istio-init' && c.securityContext.capabilities.add.all(k, k in ['NET_ADMIN', 'NET_RAW']))
      messageExpression: "'only the istio-init init container may add capabilities, and only NET_ADMIN and NET_RAW: ' + variables.init.filter(c, (has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add) && c.securityContext.capabilities.add.size() > 0) && !(c.name == 'istio-init' && c.securityContext.capabilities.add.all(k, k in ['NET_ADMIN', 'NET_RAW']))).map(c, c.name).join(', ')"
      reason: Forbidden
