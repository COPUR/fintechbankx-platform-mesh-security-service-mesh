# TLS certificate for the public gateway, synced from AWS Secrets Manager.
# Secret <env>/platform/ingress-tls holds two properties: certificate (PEM
# chain) and private_key (PEM). ENVIRONMENT is replaced per overlay.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fintechbankx-ingress-tls
  namespace: istio-ingress
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-platform
  target:
    name: fintechbankx-ingress-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: ENVIRONMENT/platform/ingress-tls
        property: certificate
    - secretKey: tls.key
      remoteRef:
        key: ENVIRONMENT/platform/ingress-tls
        property: private_key
